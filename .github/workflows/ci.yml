name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test Soroban contracts
        run: npm run test:contracts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
