name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          $HOME/.local/bin/compact update 0.31.1
          VERSION_DIR=$(dirname $(find "$HOME/.compact/versions/0.31.1" -name compactc.bin | head -n 1))
          ln -sfn "$VERSION_DIR"/* "$HOME/.compact/bin/"
          echo "$VERSION_DIR" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Compact compiler version
        run: compactc --version

      - name: Compile Compact contracts
        run: npm run contract:compile

      - name: Run default test suite
        run: npm test

      - name: Run Midnight contract tests
        run: npm run test:midnight

      - name: Test Soroban contracts
        run: npm run test:contracts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  integration:
    name: Midnight Local DevNet Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Midnight local devnet
        run: npm run test:midnight:integration:up

      - name: Run Midnight integration tests
        env:
          MIDNIGHT_DEVNET_REQUIRED: "true"
        run: npm run test:midnight:integration

      - name: Dump DevNet Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/standalone.yml logs > devnet-docker.log 2>&1 || true

      - name: Upload DevNet logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-docker-logs
          path: devnet-docker.log
          retention-days: 7

      - name: Teardown Midnight local devnet
        if: always()
        run: npm run test:midnight:integration:down
